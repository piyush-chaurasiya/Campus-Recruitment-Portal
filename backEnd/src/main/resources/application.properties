spring.application.name=sandboxpro
server.port=8080

# Aiven MySQL
spring.datasource.url=jdbc:mysql://campus-recruitment-portal-my-anatomy-project.j.aivencloud.com:17171/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=%{MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=campusPlacementPortalSecretKey2026VeryLongSecureKey123456
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB